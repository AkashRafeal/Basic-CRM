server:
  port: 8092

spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}}
    username: ${PRODUCT_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres.vqoxdxudsoaisqpltxuv}}
    password: ${PRODUCT_DB_PASS:${SPRING_DATASOURCE_PASSWORD:Basic CRM@123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

